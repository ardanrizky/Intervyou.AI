{% extends "base.html" %}

{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="brand-icon" style="margin: 0 auto 16px auto; width: 48px; height: 48px; font-size: 24px;">⚡</div>
      <h1 style="font-size: 24px; font-weight: 800; color: #ffffff;">Intervyou<span style="color: var(--accent-cyan);">.AI</span></h1>
      <p style="color: var(--text-muted); font-size: 14px; margin-top: 6px;">Simulasi Wawancara Kerja Berbasis NLP & Text Mining</p>
    </div>

    {% if error %}
    <div class="alert-error">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label class="form-label" for="name">Nama Lengkap</label>
        <input type="text" id="name" name="name" class="form-input" placeholder="Masukkan nama Anda" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="role">Bidang Pekerjaan (Role)</label>
        <select id="role" name="role" class="form-select" required>
          <option value="" disabled selected>Pilih target peran...</option>
          {% for r in roles %}
          <option value="{{ r }}">{{ r }}</option>
          {% endfor %}
        </select>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">
        Mulai Latihan Wawancara →
      </button>
    </form>
  </div>
</div>
{% endblock %}
