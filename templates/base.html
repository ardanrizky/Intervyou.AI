<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or "Intervyou.AI - Platform Latihan Wawancara Kerja Berbasis AI" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
</head>
<body>
  {% if session.get('user_name') %}
  <div class="app-container">
    <aside class="sidebar">
      <a href="{{ url_for('dashboard') }}" class="brand">
        <div class="brand-icon">⚡</div>
        <div class="brand-text">
          <span class="brand-title">Intervyou<span>.AI</span></span>
          <span class="brand-badge">Teknikal & NLP</span>
        </div>
      </a>

      <ul class="nav-links">
        <li class="nav-item {% if request.path == url_for('dashboard') %}active{% endif %}">
          <a href="{{ url_for('dashboard') }}">
            <span class="nav-icon">📊</span>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="nav-item {% if request.path == url_for('interview') %}active{% endif %}">
          <a href="{{ url_for('interview') }}">
            <span class="nav-icon">🎙️</span>
            <span>Mulai Wawancara</span>
          </a>
        </li>
        <li class="nav-item {% if request.path == url_for('history') %}active{% endif %}">
          <a href="{{ url_for('history') }}">
            <span class="nav-icon">📜</span>
            <span>Riwayat Simulasi</span>
          </a>
        </li>
      </ul>

      <div class="user-profile-box">
        <div class="user-info">
          <span class="user-name">{{ user_name }}</span>
          <span class="user-role-tag">{{ user_role }}</span>
        </div>
        <a href="{{ url_for('logout') }}" class="logout-btn" title="Keluar">⏻</a>
      </div>
    </aside>

    <main class="main-wrapper">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% else %}
    {% block auth_content %}{% endblock %}
  {% endif %}

  {% block scripts %}{% endblock %}
</body>
</html>
